services:
  claude-dev:
    container_name: ${COMPOSE_PROJECT_NAME:-claude-dev}
    build:
      context: .
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-latest}
        CODE_PATH: ${CODE_PATH}
        USERNAME: ${USER}
        USER_HOME: ${HOME}
        SSH_AUTHORIZED_KEYS: ${SSH_AUTHORIZED_KEYS}
        EXTRA_PACKAGES: ${EXTRA_PACKAGES:-}
        EXTRA_NPM_PACKAGES: ${EXTRA_NPM_PACKAGES:-}
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${ET_PORT:-2022}:2022"
    volumes:
      - ${CODE_PATH}:${CODE_PATH}
      - ${HOME}/.claude:${HOME}/.claude
      - ./.mount-stage:${HOME}/.claude-mount-stage
      - ssh-host-keys:/etc/ssh
      - ${HOME}/.ssh/known_hosts:${HOME}/.ssh/known_hosts:ro
      - build-cache:${HOME}/.cache

    environment:
      - APP_USER=${USER}
      - TZ=${TZ:-UTC}
      - GOMODCACHE=${HOME}/.cache/go-mod
      - CARGO_HOME=${HOME}/.cache/cargo
      - SVM_HOME=${HOME}/.cache/svm
      - RUSTC_WRAPPER=sccache
      - SCCACHE_DIR=${HOME}/.cache/sccache
      - SCCACHE_CACHE_SIZE=${SCCACHE_CACHE_SIZE:-30G}

    user: root
    entrypoint: /usr/local/bin/entrypoint.sh

    # runsvdir exits on SIGTERM without stopping its services. SIGHUP makes it
    # stop sshd and etserver first, so `docker compose down` is clean.
    stop_signal: SIGHUP

    restart: always

volumes:
  ssh-host-keys:
  build-cache:
