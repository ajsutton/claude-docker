# iron-proxy configuration for claude-docker.
#
# This file is copied to iron-proxy/proxy.yaml on first `./run.sh` (the copy is
# gitignored so your local edits stay local). Edit iron-proxy/proxy.yaml to
# customise egress rules and which secrets the proxy holds, then `./run.sh`
# again to reload.
#
# Model: the AI container's DNS points at the proxy, so every hostname resolves
# to it (except the `passthrough` list below). The proxy terminates TLS with a
# CA the container trusts, then either forwards the request, blocks it, or swaps
# a placeholder token for the real secret — which never leaves this container.

dns:
  listen: ":53"
  # Address the AI container reaches the proxy on. Must match the fixed IP in
  # modules/iron-proxy.yml.
  proxy_ip: "172.30.0.2"
  # Hosts that bypass the proxy entirely (resolved normally, connected directly).
  passthrough:
    # git over SSH to GitHub. Keeping github.com here means `git push`/`git
    # fetch` over SSH and commit signing via the forwarded ssh-agent keep
    # working — the proxy only speaks HTTP(S), not SSH. (GitHub's *API* host
    # api.github.com is deliberately NOT here, so the proxy can inject your
    # GitHub token there — see the secrets section below.)
    - "github.com"
    - "ssh.github.com"
    # Coding-agent API + telemetry endpoints. Passed through so Claude Code and
    # Codex talk to their providers over their own TLS, without needing to trust
    # the proxy CA, and so subscription OAuth tokens are never intercepted.
    # Remove these (and set the allowlist `warn: false` below) when you want the
    # proxy to police ALL egress.
    - "*.anthropic.com"
    - "*.openai.com"
    - "chatgpt.com"
    - "auth.openai.com"

proxy:
  http_listen: ":80"
  https_listen: ":443"
  # LLM endpoints can take a while to start streaming; don't 502 too early.
  upstream_response_header_timeout: "5m"

tls:
  # Generated by ./run.sh into iron-proxy/certs/ and mounted read-only.
  ca_cert: "/certs/ca.crt"
  ca_key: "/certs/ca.key"

transforms:
  # --- Egress policy -------------------------------------------------------
  # Default: unrestricted. `warn: true` logs every request but blocks nothing,
  # so the container behaves exactly as it did before iron-proxy — just with
  # full visibility. To RESTRICT egress, set `warn: false` and list the hosts
  # you want to allow under `domains:` (globs like "*.example.com" and CIDRs are
  # supported); everything else then gets a 403.
  - name: allowlist
    config:
      warn: true
      domains: []
      cidrs: []

  # --- Secret injection ----------------------------------------------------
  # The real secrets live ONLY in the proxy's environment (passed in from the
  # host by ./run.sh — see .env). The AI container sends a harmless placeholder;
  # the proxy swaps in the real value just before the request egresses, scoped
  # to the hosts in `rules`.
  - name: secrets
    config:
      secrets:
        # GitHub token for the `gh` CLI and REST/GraphQL API. The container's
        # GH_TOKEN is the placeholder "proxy-gh-token" (set in
        # files/entrypoint.sh); the proxy replaces it with the real GH_TOKEN.
        - source:
            type: env
            var: GH_TOKEN
          replace:
            proxy_value: "proxy-gh-token"
            match_headers: ["Authorization"]
          rules:
            - host: "api.github.com"
            - host: "uploads.github.com"

        # --- Optional: API-key auth instead of subscription OAuth ------------
        # If you authenticate Claude Code with an API key, remove
        # "*.anthropic.com" from `passthrough` above, set ANTHROPIC_API_KEY to
        # the placeholder in the container, list ANTHROPIC_API_KEY in
        # IRON_PROXY_SECRETS (.env), and uncomment:
        # - source:
        #     type: env
        #     var: ANTHROPIC_API_KEY
        #   replace:
        #     proxy_value: "proxy-anthropic-key"
        #     match_headers: ["Authorization", "x-api-key"]
        #   rules:
        #     - host: "api.anthropic.com"

        # Likewise for Codex with an OpenAI API key:
        # - source:
        #     type: env
        #     var: OPENAI_API_KEY
        #   replace:
        #     proxy_value: "proxy-openai-key"
        #     match_headers: ["Authorization"]
        #   rules:
        #     - host: "api.openai.com"

        # --- Optional: git over HTTPS (instead of SSH) -----------------------
        # If your remotes use https://github.com/... rather than SSH, remove
        # "github.com" from `passthrough`, configure a git credential helper
        # that emits the placeholder as the password, and let the proxy rewrite
        # the Basic-auth header with the real token:
        # - source:
        #     type: env
        #     var: GH_TOKEN
        #   inject:
        #     header: "Authorization"
        #     formatter: 'Basic {{ base64 "x-access-token:" .Secret }}'
        #   rules:
        #     - host: "github.com"

      # Secret sources also support 1password, 1password_connect, aws_sm and
      # aws_ssm if you'd rather the proxy fetch secrets itself instead of
      # receiving them from the host via env. See https://docs.iron.sh/.

log:
  level: "info"
